<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poké Roll</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>🎲 Poké Roll</h1>
        <p class="subtitulo">Descubra Pokémon de diferentes raridades!</p>

        <div class="giros">
            💎 Giros:
            <span id="giros">10</span>
        </div>

        <button id="girar">
            🎲 Girar
        </button>

        <div class="resultado">

            <h2>Resultado</h2>

            <div id="carta" class="carta">

                <div id="emoji" class="emoji">
                    ❔
                </div>

                <h3 id="pokemon">
                    Clique em Girar
                </h3>

                <p id="raridade">
                    Boa sorte!
                </p>

            </div>

        </div>

        <div class="colecao">

            <h2>📜 Minha coleção</h2>

            <ul id="colecaoLista">

            </ul>

        </div>

    </div>

    <script src="pokemon.js"></script>
    <script src="script.js"></script>

</body>
</html>

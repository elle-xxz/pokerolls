<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poké Roll</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>🎲 Poké Roll</h1>
        <p class="subtitulo">Descubra Pokémon de diferentes raridades!</p>

        <div class="giros">
            💎 Giros:
            <span id="giros">10</span>
        </div>

        <button id="girar">
            🎲 Girar
        </button>
<div class="chances">

    <h2>🎯 Chances</h2>

    <div class="chance">
        <span>⚪ Comum</span>
        <span>60%</span>
    </div>

    <div class="chance">
        <span>🟢 Incomum</span>
        <span>25%</span>
    </div>

    <div class="chance">
        <span>🔵 Raro</span>
        <span>10%</span>
    </div>

    <div class="chance">
        <span>🟣 Épico</span>
        <span>4%</span>
    </div>

    <div class="chance">
        <span>🟡 Lendário</span>
        <span>1%</span>
    </div>

</div>
        <div class="resultado">

            <h2>Resultado</h2>

            <div id="carta" class="carta">

                <div id="emoji" class="emoji">
                    ❔
                </div>

                <h3 id="pokemon">
                    Clique em Girar
                </h3>

                <p id="raridade">
                    Boa sorte!
                </p>

            </div>

        </div>

        <div class="colecao">

            <h2>📜 Minha coleção</h2>

            <ul id="colecaoLista">

            </ul>

        </div>

    </div>

    <script src="pokemon.js"></script>
    <script src="script.js"></script>

</body>
</html>
